name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (iOS Simulator)
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          swift --version

      - name: Build packages
        run: |
          set -o pipefail
          xcodebuild -list
          for scheme in MimoDesignSystem MimoProfile; do
            echo "::group::$scheme"
            xcodebuild build \
              -scheme "$scheme" \
              -destination 'generic/platform=iOS Simulator' \
              -skipPackagePluginValidation \
              | tee -a build.log
            echo "::endgroup::"
          done

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
