name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (iOS Simulator)
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          swift --version

      - name: Build packages
        run: |
          set -o pipefail
          xcodebuild -list
          for scheme in MimoDesignSystem MimoProfile; do
            echo "::group::$scheme"
            xcodebuild build \
              -scheme "$scheme" \
              -destination 'generic/platform=iOS Simulator' \
              -skipPackagePluginValidation \
              | tee -a build.log
            echo "::endgroup::"
          done

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

  screenshots:
    name: Screenshots (Simulator)
    runs-on: macos-26
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd App && xcodegen generate

      - name: Build app
        run: |
          set -o pipefail
          xcodebuild build \
            -project App/Mimo.xcodeproj \
            -scheme Mimo \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            | tee app-build.log

      - name: Capture screenshots
        run: .github/scripts/screenshots.sh DerivedData/Build/Products/Debug-iphonesimulator/Mimo.app screenshots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            screenshots/
            app-build.log
          if-no-files-found: ignore
